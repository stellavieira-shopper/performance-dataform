name: Pagamento de Performance — QA

# Secrets necessários:
#   BQ_OAUTH_CLIENT_ID      → OAuth BigQuery (escopo bigquery)
#   BQ_OAUTH_CLIENT_SECRET
#   BQ_OAUTH_REFRESH_TOKEN
#   SHEETS_TOKEN_JSON       → conteúdo do sheets_token.json local

on:
  workflow_dispatch:
    inputs:
      data_inicio:
        description: 'Início do período (AAAA-MM-DD) — obrigatório'
        required: true
      etapa:
        description: |
          Etapa a executar:
            performance    → fluxo completo de performance: exportar-rankings → atualizar-bq → preencher-planilha
            bonus          → fluxo de bônus recompensa: adicionar-bonus-bq → subir-bonus-planilha
            exportar       → só exportar_rankings.py
            atualizar-bq   → só atualizar_carteira.py
            preencher      → só preencher_planilha_performance.py
            bonus-bq       → só adicionar_bonus_pdf.py
            bonus-plan     → só subir_bonus_planilha.py
        required: false
        default: 'performance'

jobs:
  pagamento:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      BQ_OAUTH_CLIENT_ID: ${{ secrets.BQ_OAUTH_CLIENT_ID }}
      BQ_OAUTH_CLIENT_SECRET: ${{ secrets.BQ_OAUTH_CLIENT_SECRET }}
      BQ_OAUTH_REFRESH_TOKEN: ${{ secrets.BQ_OAUTH_REFRESH_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install --quiet \
            google-cloud-bigquery \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2 \
            google-api-python-client \
            gspread \
            python-dotenv \
            db-dtypes \
            openpyxl

      - name: Preparar credenciais OAuth e tokens
        run: |
          printf '{"type":"authorized_user","client_id":"%s","client_secret":"%s","refresh_token":"%s"}' \
            "$BQ_OAUTH_CLIENT_ID" \
            "$BQ_OAUTH_CLIENT_SECRET" \
            "$BQ_OAUTH_REFRESH_TOKEN" \
            > ${{ runner.temp }}/bq_oauth.json
          echo '${{ secrets.SHEETS_TOKEN_JSON }}' > ${{ runner.temp }}/sheets_token.json

      # ── FLUXO PERFORMANCE ────────────────────────────────────────────────────

      - name: "Performance 1/3 · exportar_rankings.py"
        if: |
          github.event.inputs.etapa == 'performance' ||
          github.event.inputs.etapa == 'exportar'
        env:
          PROJECT_ID: shopper-datalakehouse-qa
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/bq_oauth.json
          SHEETS_TOKEN_PATH: ${{ runner.temp }}/sheets_token.json
        run: |
          echo "▶ Exportando rankings — ${{ github.event.inputs.data_inicio }}"
          python scripts/exportar_rankings.py --inicio ${{ github.event.inputs.data_inicio }}

      - name: "Performance 2/3 · atualizar_carteira.py"
        if: |
          github.event.inputs.etapa == 'performance' ||
          github.event.inputs.etapa == 'atualizar-bq'
        env:
          PROJECT_ID: shopper-datalakehouse-qa
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/bq_oauth.json
          SHEETS_TOKEN_PATH: ${{ runner.temp }}/sheets_token.json
        run: |
          echo "▶ Atualizando carteira BQ — ${{ github.event.inputs.data_inicio }}"
          python scripts/atualizar_carteira.py --inicio ${{ github.event.inputs.data_inicio }}

      - name: "Performance 3/3 · preencher_planilha_performance.py"
        if: |
          github.event.inputs.etapa == 'performance' ||
          github.event.inputs.etapa == 'preencher'
        env:
          PROJECT_ID: shopper-datalakehouse-qa
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/bq_oauth.json
          SHEETS_TOKEN_PATH: ${{ runner.temp }}/sheets_token.json
        run: |
          echo "▶ Preenchendo planilha de pagamento — ${{ github.event.inputs.data_inicio }}"
          python scripts/preencher_planilha_performance.py --inicio ${{ github.event.inputs.data_inicio }}

      # ── FLUXO BÔNUS RECOMPENSA ───────────────────────────────────────────────

      - name: "Bonus 1/2 · adicionar_bonus_pdf.py"
        if: |
          github.event.inputs.etapa == 'bonus' ||
          github.event.inputs.etapa == 'bonus-bq'
        env:
          PROJECT_ID: shopper-datalakehouse-qa
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/bq_oauth.json
        run: |
          echo "▶ Aplicando bônus recompensa — ${{ github.event.inputs.data_inicio }}"
          python scripts/adicionar_bonus_pdf.py --inicio ${{ github.event.inputs.data_inicio }}

      - name: "Bonus 2/2 · subir_bonus_planilha.py"
        if: |
          github.event.inputs.etapa == 'bonus' ||
          github.event.inputs.etapa == 'bonus-plan'
        env:
          PROJECT_ID: shopper-datalakehouse-qa
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/bq_oauth.json
          SHEETS_TOKEN_PATH: ${{ runner.temp }}/sheets_token.json
        run: |
          echo "▶ Criando planilha de bônus no Drive — ${{ github.event.inputs.data_inicio }}"
          python scripts/subir_bonus_planilha.py --inicio ${{ github.event.inputs.data_inicio }}

      # ── VERIFICAÇÃO FINAL ────────────────────────────────────────────────────

      - name: "Verificacao final — carteira_operação"
        if: always()
        run: |
          python3 - <<'EOF'
          import os
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from google.cloud import bigquery

          creds = Credentials(
              token=None,
              client_id=os.environ["BQ_OAUTH_CLIENT_ID"],
              client_secret=os.environ["BQ_OAUTH_CLIENT_SECRET"],
              refresh_token=os.environ["BQ_OAUTH_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              scopes=["https://www.googleapis.com/auth/bigquery"],
          )
          creds.refresh(Request())

          client = bigquery.Client(project="shopper-datalakehouse-qa", credentials=creds)
          data_inicio = "${{ github.event.inputs.data_inicio }}"
          sql = f"""
            SELECT
              COUNT(*) AS total,
              SUM(CAST(valor_a_pagar AS FLOAT64)) AS total_a_pagar,
              SUM(CASE WHEN CAST(saldo_pos_bonificacao AS FLOAT64) > 0 THEN 1 ELSE 0 END) AS erros
            FROM `shopper-datalakehouse-qa.Ranking_Performance.carteira_operação`
            WHERE data_inicio_ranking = '{data_inicio}'
          """
          row = list(client.query(sql, location="southamerica-east1").result())[0]
          print(f"total={row.total} | total_a_pagar={(row.total_a_pagar or 0):.2f} | erros={row.erros}")
          EOF
