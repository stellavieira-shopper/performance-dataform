name: Performance Darkstore — Pipeline Semanal

# Secrets necessários:
#   BQ_DRIVE_CLIENT_ID      → OAuth BigQuery + Drive
#   BQ_DRIVE_CLIENT_SECRET
#   BQ_DRIVE_REFRESH_TOKEN

on:
  workflow_dispatch:
    inputs:
      week:
        description: 'Semana ISO (ex: 42)'
        required: true
      year:
        description: 'Ano (ex: 2026)'
        required: true
        default: '2026'
      etapa:
        description: |
          Etapa a executar:
            completo  → passos 03→07 completos
            pedidos   → só 03_int_pedidos_sla
            store     → só 04_int_store_metrics
            person    → só 05_int_person_metrics
            abast     → só 06_int_abastecimento_bonus
            mart      → só 07_mart_bonificacao
            backfill  → backfill histórico (rodar uma vez)
        required: false
        default: 'completo'
      skip_abast:
        description: 'Pular abastecimento? (true/false)'
        required: false
        default: 'false'

jobs:
  darkstore:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      BQ_DRIVE_CLIENT_ID: ${{ secrets.BQ_DRIVE_CLIENT_ID }}
      BQ_DRIVE_CLIENT_SECRET: ${{ secrets.BQ_DRIVE_CLIENT_SECRET }}
      BQ_DRIVE_REFRESH_TOKEN: ${{ secrets.BQ_DRIVE_REFRESH_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install --quiet \
            google-cloud-bigquery \
            google-auth \
            google-auth-oauthlib \
            db-dtypes

      # ── FLUXO COMPLETO ───────────────────────────────────────────────────────

      - name: "Pipeline completo (03→07)"
        if: github.event.inputs.etapa == 'completo'
        run: |
          SKIP=""
          if [ "${{ github.event.inputs.skip_abast }}" = "true" ]; then
            SKIP="--skip-abast"
          fi
          echo "▶ Pipeline W${{ github.event.inputs.week }}/${{ github.event.inputs.year }}"
          python scripts/run_darkstore_week.py \
            --week ${{ github.event.inputs.week }} \
            --year ${{ github.event.inputs.year }} \
            $SKIP

      # ── ETAPAS INDIVIDUAIS ───────────────────────────────────────────────────

      - name: "03 · int_pedidos_sla"
        if: github.event.inputs.etapa == 'pedidos'
        run: |
          python scripts/run_darkstore_week.py \
            --week ${{ github.event.inputs.week }} \
            --year ${{ github.event.inputs.year }} \
            --only pedidos

      - name: "04 · int_store_metrics"
        if: github.event.inputs.etapa == 'store'
        run: |
          python scripts/run_darkstore_week.py \
            --week ${{ github.event.inputs.week }} \
            --year ${{ github.event.inputs.year }} \
            --only store

      - name: "05 · int_person_metrics"
        if: github.event.inputs.etapa == 'person'
        run: |
          python scripts/run_darkstore_week.py \
            --week ${{ github.event.inputs.week }} \
            --year ${{ github.event.inputs.year }} \
            --only person

      - name: "06 · int_abastecimento_bonus"
        if: github.event.inputs.etapa == 'abast'
        run: |
          python scripts/run_darkstore_week.py \
            --week ${{ github.event.inputs.week }} \
            --year ${{ github.event.inputs.year }} \
            --only abast

      - name: "07 · mart_bonificacao"
        if: github.event.inputs.etapa == 'mart'
        run: |
          python scripts/run_darkstore_week.py \
            --week ${{ github.event.inputs.week }} \
            --year ${{ github.event.inputs.year }} \
            --only mart

      # ── BACKFILL HISTÓRICO ───────────────────────────────────────────────────

      - name: "Backfill histórico QA → prod"
        if: github.event.inputs.etapa == 'backfill'
        run: |
          echo "▶ Backfill histórico — shopper-datalakehouse-qa → shopper-performance-prod"
          python scripts/run_bq_query.py jobs/darkstore/backfill_historico.sql \
            --project shopper-performance-prod

      # ── VERIFICAÇÃO FINAL ────────────────────────────────────────────────────

      - name: "Verificação — mart_bonificacao"
        if: |
          always() &&
          (github.event.inputs.etapa == 'completo' || github.event.inputs.etapa == 'mart')
        run: |
          python3 - <<'EOF'
          import os
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from google.cloud import bigquery

          creds = Credentials(
              token=None,
              client_id=os.environ["BQ_DRIVE_CLIENT_ID"],
              client_secret=os.environ["BQ_DRIVE_CLIENT_SECRET"],
              refresh_token=os.environ["BQ_DRIVE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              scopes=["https://www.googleapis.com/auth/bigquery"],
          )
          creds.refresh(Request())

          client = bigquery.Client(project="shopper-performance-prod", credentials=creds)
          week = "${{ github.event.inputs.week }}"
          year = "${{ github.event.inputs.year }}"
          sql = f"""
            SELECT
              week_ref,
              COUNT(*) AS colaboradores,
              COUNTIF(valor_final_bonus > 0) AS bonificados,
              ROUND(SUM(valor_final_bonus), 2) AS total_bonus,
              COUNTIF(gate_loja_80_flag) AS gate_sla,
              COUNTIF(gate_foto_flag) AS gate_foto,
              COUNTIF(assiduidade_any_flag) AS gate_assid
            FROM `shopper-performance-prod.darkstore.mart_bonificacao`
            WHERE year_ref = {year} AND week_ref = {week}
            GROUP BY 1
          """
          rows = list(client.query(sql, location="southamerica-east1").result())
          if not rows:
              print(f"⚠️  Nenhum dado encontrado para W{week}/{year}")
          else:
              r = rows[0]
              print(f"W{week}/{year} | colaboradores={r.colaboradores} | bonificados={r.bonificados} | total_bonus={r.total_bonus:.2f} | gate_sla={r.gate_sla} | gate_foto={r.gate_foto} | gate_assid={r.gate_assid}")
          EOF
